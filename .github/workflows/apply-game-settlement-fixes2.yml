name: Apply game settlement source fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply fixes
        run: node scripts/apply-game-settlement-fixes.mjs
      - name: Verify build
        run: npm install && npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src prisma/schema.prisma
          git diff --cached --quiet && exit 0
          git commit -m "fix: game settlement and matchmaking source behavior"
          git push origin main
