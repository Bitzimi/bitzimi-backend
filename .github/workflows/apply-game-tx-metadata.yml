name: Apply Game Transaction Metadata Patch
on:
  push:
    branches: [fix/game-transaction-metadata]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch wallet ledger metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/modules/wallets/wallets.service.ts')
          s = p.read_text()
          old = '''  const fee       = entry.fee ?? 0;\n  const netAmount = parseFloat((entry.amount - fee).toFixed(8));\n  await tx.transaction.create({\n    data: {'''
          new = '''  const fee       = entry.fee ?? 0;\n  const netAmount = parseFloat((entry.amount - fee).toFixed(8));\n  let metadata = entry.metadata ? { ...entry.metadata } : {};\n  if (entry.referenceType === "game_bet" && entry.referenceId) {\n    const bet = await tx.gameBet.findUnique({\n      where: { id: entry.referenceId },\n      select: { amount: true, round: { select: { gameType: true, lobbyId: true } } },\n    });\n    if (bet) {\n      metadata = { gameType: bet.round.gameType, stake: bet.amount, ...(bet.round.lobbyId ? { lobby: bet.round.lobbyId } : {}), ...metadata };\n    }\n  }\n  await tx.transaction.create({\n    data: {'''
          if old not in s: raise SystemExit('wallet ledger insertion point not found')
          s = s.replace(old, new, 1)
          s = s.replace('      metadata:      entry.metadata ? JSON.stringify(entry.metadata) : null,', '      metadata:      Object.keys(metadata).length ? JSON.stringify(metadata) : null,', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/wallets/wallets.service.ts
          git diff --cached --quiet || (git commit -m "Standardize game transaction metadata" && git push)
# trigger
