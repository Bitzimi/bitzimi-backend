name: Fix Color History V1
on:
  push:
    paths: ['.github/workflows/fix-color-history-v1.yml']
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Apply and verify
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/modules/games/colorGame/colorGame.service.ts')
          s=p.read_text()
          old='where: { gameType: "color_game", lobbyId: "A", status: { in: ["completed", "cancelled_insufficient_opposition"] } }, orderBy: { startedAt: "desc" }, take: 50'
          new='where: { gameType: "color_game", lobbyId, status: { in: ["completed", "cancelled_insufficient_opposition"] } }, orderBy: { startedAt: "desc" }, take: 10'
          if old not in s: raise SystemExit('hard-coded Lobby A history query not found')
          s=s.replace(old,new,1)
          old2='export async function getLobbyState(lobbyId: string, userId?: string) {\n  await recoverStaleColorRounds();\n  const state = await ensureLobby(lobbyId);'
          new2='export async function getLobbyState(lobbyId: string, userId?: string) {\n  await recoverStaleColorRounds();\n  // The API is also a state-advancement path: never return an old round after its 90s slot has ended.\n  const preSchedule = getGlobalRound();\n  if (Date.now() - preSchedule.startMs >= WAITING_DURATION_MS) {\n    await tickLobby(lobbyId);\n  }\n  const state = await ensureLobby(lobbyId);'
          if old2 not in s: raise SystemExit('getLobbyState handoff block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          npm run build
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-color-history-v1.yml
          git add src/modules/games/colorGame/colorGame.service.ts
          git commit -m 'Fix Color Prediction per-lobby history and round handoff'
          git push
