name: BitZimi one-time color and fairness fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/modules/games/colorGame/colorGame.service.ts')
          s=p.read_text()
          old='''  const historyRows = await db.gameRound.findMany({\n    where: { gameType: "color_game", status: { in: ["completed", "cancelled_insufficient_opposition"] }, startedAt: { lte: new Date() } },\n    orderBy: { startedAt: "desc" }, take: 200,\n    select: { id: true, roundNumber: true, dailyRoundNumber: true, resultData: true, settledAt: true, startedAt: true, status: true },\n  });\n  const historyByRound = new Map<number, { roundNumber: number; result: "red" | "blue"; voided: boolean; timestamp: string }>();\n  for (const r of historyRows) {\n    const roundNumber = r.dailyRoundNumber ?? r.roundNumber;\n    const data = r.resultData ? JSON.parse(r.resultData) : null;\n    if (!historyByRound.has(roundNumber) && (data?.result === "red" || data?.result === "blue")) {\n      historyByRound.set(roundNumber, { roundNumber, result: data.result, voided: r.status === "cancelled_insufficient_opposition" || data.voided === true, timestamp: r.settledAt?.toISOString() ?? r.startedAt.toISOString() });\n    }\n  }\n  const history = [...historyByRound.values()].sort((a, b) => b.roundNumber - a.roundNumber).slice(0, 10);\n  const historyRoundRows = userId ? await db.gameRound.findMany({ where: { gameType: "color_game", lobbyId }, orderBy: { startedAt: "desc" }, take: 50, select: { id: true, roundNumber: true, dailyRoundNumber: true } }) : [];\n  const historyRoundNumbers = new Map(historyRoundRows.map(r => [r.id, r.dailyRoundNumber ?? r.roundNumber]));\n  const personalBets = userId && historyRoundRows.length ? await db.gameBet.findMany({ where: { userId, roundId: { in: historyRoundRows.map(r => r.id) } }, orderBy: { placedAt: "desc" }, take: 50 }) : [];\n'''
          new='''  const historyRows = await db.gameRound.findMany({\n    where: { gameType: "color_game", lobbyId, status: { in: ["completed", "cancelled_insufficient_opposition"] }, startedAt: { lte: new Date() } },\n    orderBy: { startedAt: "desc" }, take: 200,\n    select: { id: true, roundNumber: true, dailyRoundNumber: true, resultData: true, settledAt: true, startedAt: true, status: true },\n  });\n  const history = historyRows\n    .map(r => { const data = r.resultData ? JSON.parse(r.resultData) : null; return (data?.result === "red" || data?.result === "blue") ? { roundNumber: r.dailyRoundNumber ?? r.roundNumber, result: data.result, voided: r.status === "cancelled_insufficient_opposition" || data.voided === true, timestamp: r.settledAt?.toISOString() ?? r.startedAt.toISOString() } : null; })\n    .filter((r): r is { roundNumber: number; result: "red" | "blue"; voided: boolean; timestamp: string } => r !== null)\n    .slice(0, 10);\n  const historyRoundRows = userId ? await db.gameRound.findMany({ where: { gameType: "color_game", lobbyId }, orderBy: { startedAt: "desc" }, take: 200, select: { id: true, roundNumber: true, dailyRoundNumber: true } }) : [];\n  const historyRoundNumbers = new Map(historyRoundRows.map(r => [r.id, r.dailyRoundNumber ?? r.roundNumber]));\n  const personalBets = userId && historyRoundRows.length ? await db.gameBet.findMany({ where: { userId, roundId: { in: historyRoundRows.map(r => r.id) } }, orderBy: { placedAt: "desc" }, take: 50 }) : [];\n'''
          if old not in s: raise SystemExit('color target not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Remove workflow after successful patch
        run: rm -f .github/workflows/bitzimi-one-time-fix.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/games/colorGame/colorGame.service.ts .github/workflows/bitzimi-one-time-fix.yml
          git commit -m 'Fix Color Prediction lobby history and persistent bet history' || exit 0
          git push
