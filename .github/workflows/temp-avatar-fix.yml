name: Temporary opponent avatar fix

on:
  push:
    branches: ["temp/avatar-fix"]

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move patched matchmaking service into source tree
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

          test -f modules/games/matchmaking/matchmaking.service.ts
          test -f src/modules/games/matchmaking/matchmaking.service.ts
          cp modules/games/matchmaking/matchmaking.service.ts src/modules/games/matchmaking/matchmaking.service.ts
          rm -f modules/games/matchmaking/matchmaking.service.ts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached -- src/modules/games/matchmaking/matchmaking.service.ts
          git commit -m "fix: return canonical opponent avatar in match result"
          git push origin main
