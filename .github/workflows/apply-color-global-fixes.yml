name: Apply Color Prediction Global Fixes
on:
  push:
    branches: [fix/color-prediction-global-results-settlement]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Color Prediction service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/modules/games/colorGame/colorGame.service.ts')
          s = p.read_text()
          s = s.replace('metadata: { gameType: "color_game", roundId: state.roundId, roundNumber: state.dailyRoundNumber, voided: true }', 'metadata: { gameType: "color_game", lobby: lobbyId, roundId: state.roundId, roundNumber: state.dailyRoundNumber, voided: true }')
          s = s.replace('metadata: { team: winningTeam, roundId: state.roundId, roundNumber: state.dailyRoundNumber, stake: bet.amount, payout }', 'metadata: { gameType: "color_game", lobby: lobbyId, team: winningTeam, roundId: state.roundId, roundNumber: state.dailyRoundNumber, stake: bet.amount, payout }')
          s = s.replace('metadata: { team: betTeam, winner: winningTeam, roundId: state.roundId, roundNumber: state.dailyRoundNumber, stake: bet.amount, payout: 0 }', 'metadata: { gameType: "color_game", lobby: lobbyId, team: betTeam, winner: winningTeam, roundId: state.roundId, roundNumber: state.dailyRoundNumber, stake: bet.amount, payout: 0 }')
          s = s.replace('description: "Color game void — full refund"', 'description: `Color Prediction void — Lobby ${lobbyId}`')
          s = s.replace('description: `Color game win — team ${winningTeam}`', 'description: `Color Prediction win — Lobby ${lobbyId}`')
          s = s.replace('description: `Color game loss — team ${betTeam}`', 'description: `Color Prediction loss — Lobby ${lobbyId}`')
          marker = 'async function enterSpinning(lobbyId: string, state: LobbyState): Promise<void> {'
          helper = '''async function getGlobalColorFairnessSeed(dailyRoundNumber: number, fallbackSeed: string): Promise<string> {\n  return db.$transaction(async tx => {\n    await tx.$executeRaw`SELECT pg_advisory_xact_lock(hashtext(${`color-global:${dailyRoundNumber}`}))`;\n    const canonical = await tx.gameRound.findFirst({ where: { gameType: "color_game", dailyRoundNumber, serverSeed: { not: null } }, orderBy: { startedAt: "asc" }, select: { serverSeed: true } });\n    const seed = canonical?.serverSeed ?? fallbackSeed;\n    await tx.gameRound.updateMany({ where: { gameType: "color_game", dailyRoundNumber, status: { in: ["waiting", "spinning", "result"] } }, data: { serverSeed: seed, serverSeedHash: hashServerSeed(seed) } });\n    return seed;\n  });\n}\n\n'''
          if marker in s and 'async function getGlobalColorFairnessSeed' not in s: s = s.replace(marker, helper + marker)
          old = '''  const bettors = await db.gameBet.findMany({ where: { roundId: state.roundId }, select: { userId: true } });\n  const sortedIds = [...new Set(bettors.map(b => String(b.userId)))].sort();\n  const clientSeed: string = String(generateClientSeed(...sortedIds, String(state.roundId)));\n  const result = deriveColorResult(String(state.serverSeed), clientSeed, Number(state.dailyRoundNumber));\n  state.clientSeed = clientSeed; state.result = result; state.serverSeedHash = hashServerSeed(String(state.serverSeed));'''
          new = '''  const globalServerSeed = await getGlobalColorFairnessSeed(state.dailyRoundNumber, String(state.serverSeed));\n  const clientSeed: string = `color-global-${state.dailyRoundNumber}`;\n  const result = deriveColorResult(globalServerSeed, clientSeed, Number(state.dailyRoundNumber));\n  state.serverSeed = globalServerSeed; state.clientSeed = clientSeed; state.result = result; state.serverSeedHash = hashServerSeed(globalServerSeed);'''
          if old in s: s = s.replace(old, new)
          old_hist = '''  const historyRows = await db.gameRound.findMany({ where: { gameType: "color_game", lobbyId, status: { in: ["completed", "cancelled_insufficient_opposition"] }, startedAt: { lte: new Date() } }, orderBy: { startedAt: "desc" }, take: 100, select: { roundNumber: true, dailyRoundNumber: true, resultData: true, settledAt: true, startedAt: true, status: true } });\n  const history: Array<{ roundNumber: number; result: "red" | "blue"; voided: boolean; timestamp: string }> = [];\n  for (const r of historyRows) {\n    const data = r.resultData ? JSON.parse(r.resultData) : null;\n    if (data?.result === "red" || data?.result === "blue") history.push({ roundNumber: r.dailyRoundNumber ?? r.roundNumber, result: data.result, voided: r.status === "cancelled_insufficient_opposition" || data.voided === true, timestamp: (r.settledAt ?? r.startedAt).toISOString() });\n  }'''
          new_hist = '''  const historyRows = await db.gameRound.findMany({ where: { gameType: "color_game", status: { in: ["completed", "cancelled_insufficient_opposition"] }, startedAt: { lte: new Date() } }, orderBy: { startedAt: "desc" }, take: 200, select: { id: true, roundNumber: true, dailyRoundNumber: true, resultData: true, settledAt: true, startedAt: true, status: true } });\n  const historyByRound = new Map<number, { roundNumber: number; result: "red" | "blue"; voided: boolean; timestamp: string }>();\n  for (const r of historyRows) { const daily = r.dailyRoundNumber ?? r.roundNumber; const data = r.resultData ? JSON.parse(r.resultData) : null; if (!historyByRound.has(daily) && (data?.result === "red" || data?.result === "blue")) historyByRound.set(daily, { roundNumber: daily, result: data.result, voided: r.status === "cancelled_insufficient_opposition" || data.voided === true, timestamp: (r.settledAt ?? r.startedAt).toISOString() }); }\n  const history = [...historyByRound.values()].sort((a,b) => b.roundNumber - a.roundNumber).slice(0, 10);'''
          if old_hist in s: s = s.replace(old_hist, new_hist)
          old_phase = '''  if (state.dailyRoundNumber === schedule.dailyRoundNumber) { if (elapsed < WAITING_DURATION_MS) state.phase = "waiting"; else if (elapsed < WAITING_DURATION_MS + SPINNING_DURATION_MS) state.phase = "spinning"; else state.phase = "result"; }\n  const currentBets = await db.gameBet.findMany'''
          new_phase = '''  if (state.dailyRoundNumber === schedule.dailyRoundNumber) {\n    if (elapsed < WAITING_DURATION_MS) state.phase = "waiting";\n    else if (elapsed < WAITING_DURATION_MS + SPINNING_DURATION_MS) state.phase = "spinning";\n    else {\n      state.phase = "result";\n      const unsettled = await db.gameBet.count({ where: { roundId: state.roundId, settled: false } });\n      if (unsettled > 0) await settleRound(lobbyId, state);\n      const settledRound = await db.gameRound.findUnique({ where: { id: state.roundId }, select: { status: true, resultData: true } });\n      state.voided = settledRound?.status === "cancelled_insufficient_opposition" || (settledRound?.resultData ? JSON.parse(settledRound.resultData).voided === true : false);\n    }\n  }\n  const currentBets = await db.gameBet.findMany'''
          if old_phase in s: s = s.replace(old_phase, new_phase)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/games/colorGame/colorGame.service.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix Color Prediction global results and settlement timing"
          git push
# trigger
