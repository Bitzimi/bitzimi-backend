name: Fix Spin Battle Bet Ordering
on:
  push:
    paths:
      - .github/workflows/fix-spin-battle-order.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace invalid GameBet ordering field
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/modules/games/spinBattle/spinBattle.service.ts')
          s=p.read_text().replace('orderBy: { createdAt: "asc" }','orderBy: { placedAt: "asc" }')
          p.write_text(s)
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/games/spinBattle/spinBattle.service.ts
          git commit -m "Fix Spin Battle bet ordering" || true
          git push
          rm -f .github/workflows/fix-spin-battle-order.yml
          git add -u .github/workflows/fix-spin-battle-order.yml
          git commit -m "Remove temporary Spin Battle ordering workflow" || true
          git push