name: Fix transaction hydration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[transaction-details-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply transaction-specific fixes
        shell: python
        run: |
          from pathlib import Path

          # Do not expose internal ledger/reference UUIDs as payment Reference IDs.
          for name in ['src/modules/wallets/wallets.service.ts', 'src/modules/transactions/transactions.service.ts']:
              p = Path(name)
              s = p.read_text()
              s = s.replace('  if (entry.referenceId) metadata.referenceRecordId = entry.referenceId;\n', '')
              s = s.replace('  if (entry.referenceType) metadata.referenceRecordType = entry.referenceType;\n', '')
              s = s.replace('  if (raw.referenceId) metadata.referenceRecordId = raw.referenceId;\n', '')
              s = s.replace('  if (raw.referenceType) metadata.referenceRecordType = raw.referenceType;\n', '')
              s = s.replace('month: metadata.month ?? (raw.createdAt ? new Date(raw.createdAt).toLocaleString("en-US", { month: "long", year: "numeric" }) : null)', 'month: undefined')
              p.write_text(s)

          # A Colour Prediction refund is a Game Void, never a generic Transfer.
          p = Path('src/modules/games/colorGame/colorGame.service.ts')
          s = p.read_text()
          old = 'type: "transfer", toWallet: "game", amount: bet.amount, description: `Color Prediction void — Lobby ${lobbyId}`'
          new = 'type: "game_void", toWallet: "game", amount: bet.amount, description: `Color Prediction void — Lobby ${lobbyId}`'
          s = s.replace(old, new)
          p.write_text(s)

          # VIP purchase/streak are their own transaction categories.
          p = Path('src/modules/vip/vip.service.ts')
          s = p.read_text()
          s = s.replace('userId, type: "transfer", fromWallet: "game", amount: vipPrice,', 'userId, type: "vip_purchase", fromWallet: "game", amount: vipPrice,')
          s = s.replace('userId, type: "transfer", toWallet: "game", amount: rewardUSD,', 'userId, type: "streak_reward", toWallet: "game", amount: rewardUSD,')
          s = s.replace('metadata: { day: newStreak, sourceLabel: "Daily Streak", destinationLabel: "Game Wallet", month: new Date().toLocaleString("en-US", { month: "long", year: "numeric" }) }', 'metadata: { day: newStreak, sourceLabel: "Daily Streak", destinationLabel: "Game Wallet" }')
          p.write_text(s)

          # Reward records carry a real source and destination description.
          p = Path('src/modules/tasks/proofs.service.ts')
          s = p.read_text()
          s = s.replace('metadata: { taskId: proof.taskId } });\n        if ((proof.rewardAmount ?? 0) > 0)', 'metadata: { taskId: proof.taskId, sourceLabel: `Task: ${proof.task.title}`, destinationLabel: "Task Wallet" } });\n        if ((proof.rewardAmount ?? 0) > 0)')
          p.write_text(s)

          p = Path('src/modules/affiliates/commissions.ts')
          s = p.read_text()
          s = s.replace('metadata: { tier, eventType, sourceUserId, rate, programLevel: node.programLevel },', 'metadata: { tier, eventType, sourceUserId, rate, programLevel: node.programLevel, sourceLabel: `${eventType} commission`, destinationLabel: `${walletType} Wallet` },')
          p.write_text(s)
      - name: Verify and commit
        run: |
          npm install
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/wallets/wallets.service.ts src/modules/transactions/transactions.service.ts src/modules/games/colorGame/colorGame.service.ts src/modules/vip/vip.service.ts src/modules/tasks/proofs.service.ts src/modules/affiliates/commissions.ts
          git diff --cached --quiet || git commit -m "Fix transaction-specific wallet history details [transaction-details-fixed]"
          git push