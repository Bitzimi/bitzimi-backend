name: Fix transaction hydration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[transaction-details-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply transaction-specific fixes
        shell: python
        run: |
          from pathlib import Path
          for name in ['src/modules/wallets/wallets.service.ts','src/modules/transactions/transactions.service.ts']:
              p=Path(name); s=p.read_text()
              for old in ['  if (entry.referenceId) metadata.referenceRecordId = entry.referenceId;\n','  if (entry.referenceType) metadata.referenceRecordType = entry.referenceType;\n','  if (raw.referenceId) metadata.referenceRecordId = raw.referenceRecordId;\n','  if (raw.referenceType) metadata.referenceRecordType = raw.referenceType;\n']:
                  s=s.replace(old,'')
              s=s.replace('month: metadata.month ?? (raw.createdAt ? new Date(raw.createdAt).toLocaleString("en-US", { month: "long", year: "numeric" }) : null)','month: undefined')
              marker='  const lower = String(description ?? "").toLowerCase();'
              inject='''  if (type === "affiliate_commission") metadata = { ...metadata, sourceLabel: metadata.sourceLabel ?? `${walletLabel(metadata.eventType ?? "Activity")} commission`, destinationLabel: metadata.destinationLabel ?? `${walletLabel(raw.toWallet ?? "affiliate")} Wallet` };\n  if (type === "ambassador_commission") metadata = { ...metadata, sourceLabel: metadata.sourceLabel ?? `${walletLabel(metadata.eventType ?? "Activity")} reward`, destinationLabel: metadata.destinationLabel ?? `${walletLabel(raw.toWallet ?? "ambassador")} Wallet` };\n  if (type === "referral_bonus") metadata = { ...metadata, sourceLabel: metadata.sourceLabel ?? "Referral Reward", destinationLabel: metadata.destinationLabel ?? `${walletLabel(raw.toWallet ?? "referral")} Wallet` };\n  if ((metadata.gameType || raw.referenceType === "game_round" || raw.referenceType === "pvp_match") && /\\b(void|refund|cancelled)\\b/i.test(description ?? "")) type = "game_void";\n  if (raw.referenceType === "auction_collection" && raw.referenceId) { const c = await db.auctionCollection.findUnique({ where: { id: raw.referenceId }, include: { auction: true } }).catch(() => null); if (c) metadata = { ...metadata, auctionId: c.auctionId, auctionTitle: c.auction?.title, rewardType: c.auction?.rewardType, sourceLabel: c.auction?.title ? `Auction Reward: ${c.auction.title}` : "Auction Reward", destinationLabel: raw.toWallet ? `${walletLabel(raw.toWallet)} Wallet` : "Game Wallet" }; }\n  if (raw.referenceType === "featured_request" && raw.referenceId) { const f = await db.featuredRequest.findUnique({ where: { id: raw.referenceId }, select: { id: true, taskId: true, durationDays: true, amount: true, userId: true, promotion: { select: { title: true, locations: true } } } }).catch(() => null); if (f) metadata = { ...metadata, taskId: f.taskId, durationDays: f.durationDays, title: f.promotion?.title, locations: f.promotion?.locations, sourceLabel: type === "featured_refund" ? "Featured Placement Refund" : "Featured Placement", destinationLabel: raw.toWallet ? `${walletLabel(raw.toWallet)} Wallet` : undefined }; }\n'''
              if marker in s and 'raw.referenceType === "auction_collection"' not in s:
                  s=s.replace(marker,inject+marker,1)
              p.write_text(s)
          p=Path('src/modules/games/colorGame/colorGame.service.ts'); s=p.read_text(); s=s.replace('type: "transfer", toWallet: "game", amount: bet.amount, description: `Color Prediction void — Lobby ${lobbyId}`','type: "game_void", toWallet: "game", amount: bet.amount, description: `Color Prediction void — Lobby ${lobbyId}`'); p.write_text(s)
          p=Path('src/modules/vip/vip.service.ts'); s=p.read_text(); s=s.replace('userId, type: "transfer", fromWallet: "game", amount: vipPrice,','userId, type: "vip_purchase", fromWallet: "game", amount: vipPrice,'); s=s.replace('userId, type: "transfer", toWallet: "game", amount: rewardUSD,','userId, type: "streak_reward", toWallet: "game", amount: rewardUSD,'); s=s.replace('metadata: { day: newStreak, sourceLabel: "Daily Streak", destinationLabel: "Game Wallet", month: new Date().toLocaleString("en-US", { month: "long", year: "numeric" }) }','metadata: { day: newStreak, sourceLabel: "Daily Streak", destinationLabel: "Game Wallet" }'); p.write_text(s)
          p=Path('src/modules/tasks/proofs.service.ts'); s=p.read_text(); s=s.replace('metadata: { taskId: proof.taskId } });','metadata: { taskId: proof.taskId, sourceLabel: `Task: ${proof.task.title}`, destinationLabel: "Task Wallet" } });'); p.write_text(s)
          p=Path('src/modules/affiliates/commissions.ts'); s=p.read_text(); s=s.replace('metadata: { tier, eventType, sourceUserId, rate, programLevel: node.programLevel },','metadata: { tier, eventType, sourceUserId, rate, programLevel: node.programLevel, sourceLabel: `${eventType} commission`, destinationLabel: `${walletType} Wallet` },'); p.write_text(s)
      - name: Verify and commit
        run: |
          npm install
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/wallets/wallets.service.ts src/modules/transactions/transactions.service.ts src/modules/games/colorGame/colorGame.service.ts src/modules/vip/vip.service.ts src/modules/tasks/proofs.service.ts src/modules/affiliates/commissions.ts
          git diff --cached --quiet || git commit -m "Hydrate auction and featured transaction details [transaction-details-fixed]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main