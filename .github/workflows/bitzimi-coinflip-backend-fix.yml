name: Apply Coin Flip backend fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Coin Flip backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/modules/games/matchmaking/matchmaking.service.ts')
          s=p.read_text()
          old='''  // For dice_clash and pvp_coinflip: generate result immediately
  if (gameType === "dice_clash") {
    await resolveDiceClash(match.id, player1Id, player2Id, stake, fee, totalPool, serverSeed, feeRate);
  } else if (gameType === "pvp_coinflip") {
    await resolveCoinFlip(match.id, player1Id, player2Id, stake, fee, totalPool, serverSeed, feeRate);
  }
  // reaction_tap: result generated after both players submit tap times
  '''
          new='''  // Coin Flip result is determined server-side now, while financial settlement
  // is deferred until the result has been revealed to the participants.
  if (gameType === "dice_clash") {
    await resolveDiceClash(match.id, player1Id, player2Id, stake, fee, totalPool, serverSeed, feeRate);
  } else if (gameType === "pvp_coinflip") {
    await prepareCoinFlip(match.id, player1Id, player2Id, stake, fee, totalPool, serverSeed);
  }
  // reaction_tap: result generated after both players submit tap times
  '''
          if old not in s: raise SystemExit('match creation block not found')
          s=s.replace(old,new)
          a=s.index('async function resolveCoinFlip(')
          b=s.index('// ── Get match state',a)
          replacement='''async function prepareCoinFlip(matchId: string, p1Id: string, p2Id: string, stake: number, fee: number, totalPool: number, serverSeed: string) {
  const clientSeed = generateClientSeed(...[p1Id, p2Id].sort(), matchId);
  // Home/Away assignment and Heads/Tails assignment are independent cryptographic derivations.
  const homeGetsPlayer1 = deriveCoinFlip(serverSeed, clientSeed, 2) === "heads";
  const homePlayerId = homeGetsPlayer1 ? p1Id : p2Id;
  const awayPlayerId = homeGetsPlayer1 ? p2Id : p1Id;
  const p1Side = deriveCoinFlip(serverSeed, clientSeed, 3);
  const p2Side = p1Side === "heads" ? "tails" : "heads";
  const coinFlip = deriveCoinFlip(serverSeed, clientSeed, 1);
  const winnerId = coinFlip === p1Side ? p1Id : p2Id;
  const payout = totalPool - fee;
  const resultData = JSON.stringify({ homePlayerId, awayPlayerId, p1Side, p2Side, coinFlip, winnerId });
  await db.pvpMatch.update({
    where: { id: matchId },
    data: { resultData, clientSeed, nonce: 1, serverSeed },
  });
}

export async function settleCoinFlip(userId: string, matchId: string) {
  const match = await db.pvpMatch.findFirst({
    where: { id: matchId, gameType: "pvp_coinflip", OR: [{ player1Id: userId }, { player2Id: userId }] },
  });
  if (!match) throw Object.assign(new Error("Match not found"), { statusCode: 404, code: "NOT_FOUND" });
  if (match.status === "settled") {
    const resultData = match.resultData ? JSON.parse(match.resultData) : {};
    const feeRate = await getGameFeeRate("pvp_coinflip");
    return { settled: true, winnerId: resultData.winnerId ?? match.winnerId, payout: match.stake * 2 - (match.stake * 2 * feeRate) };
  }
  if (match.status !== "active") throw Object.assign(new Error("Coin Flip match is not ready for settlement"), { statusCode: 409, code: "MATCH_NOT_SETTLEABLE" });
  const resultData = match.resultData ? JSON.parse(match.resultData) : null;
  if (!resultData?.winnerId || !resultData?.coinFlip || !resultData?.p1Side || !resultData?.p2Side) {
    throw Object.assign(new Error("Coin Flip result is not ready"), { statusCode: 409, code: "RESULT_NOT_READY" });
  }
  const feeRate = await getGameFeeRate("pvp_coinflip");
  const totalPool = match.stake * 2;
  const fee = totalPool * feeRate;
  const payout = totalPool - fee;
  const winnerId = resultData.winnerId as string;
  const loserId = winnerId === match.player1Id ? match.player2Id : match.player1Id;
  const clientSeed = match.clientSeed ?? generateClientSeed(...[match.player1Id, match.player2Id].sort(), match.id);
  await db.$transaction(async (tx) => {
    const claimed = await tx.pvpMatch.updateMany({ where: { id: matchId, status: "active" }, data: { status: "settling" } });
    if (claimed.count !== 1) return;
    await creditWallet(tx, winnerId, "game", payout);
    await writeLedgerEntry(tx, { userId: winnerId, type: "game_win", toWallet: "game", amount: payout, description: "Coin flip win", referenceId: matchId, referenceType: "pvp_match" });
    await tx.pvpMatch.update({ where: { id: matchId }, data: { status: "settled", winnerId, settledAt: new Date(), clientSeed, nonce: 1 } });
    await recordGameResult({ tx, userId: winnerId, gameType: "pvp_coinflip", wagered: match.stake, won: true, payout });
    await recordGameResult({ tx, userId: loserId, gameType: "pvp_coinflip", wagered: match.stake, won: false, payout: 0 });
    const userFee = match.stake * feeRate;
    await createGameFeeJobInTx(tx, { userId: winnerId, userFee, isMultiGame: false, eventRefId: matchId });
    await createGameFeeJobInTx(tx, { userId: loserId, userFee, isMultiGame: false, eventRefId: matchId });
  });
  return { settled: true, winnerId, payout };
}

'''
          s=s[:a]+replacement+s[b:]
          old2='''    winnerId:      match.winnerId,
    youWon:        match.winnerId === userId,
    payout:        match.winnerId === userId ? totalPool - fee : 0,
  '''
          new2='''    winnerId:      match.winnerId ?? resultData?.winnerId ?? null,
    playerIsHome: resultData?.homePlayerId === userId,
    youWon:        (match.winnerId ?? resultData?.winnerId) === userId,
    // Match-level winner amount: identical for both participants.
    payout:        totalPool - fee,
  '''
          if old2 not in s: raise SystemExit('getMatch payout block not found')
          s=s.replace(old2,new2)
          p.write_text(s)

          p=Path('src/modules/games/matchmaking/matchmaking.routes.ts')
          s=p.read_text()
          s=s.replace('import { joinQueue, getQueueStatus, leaveQueue, getMatch, signalReady, submitTap, MatchGameType } from "./matchmaking.service";', 'import { joinQueue, getQueueStatus, leaveQueue, getMatch, settleCoinFlip, signalReady, submitTap, MatchGameType } from "./matchmaking.service";')
          marker='''  // POST /api/v1/games/matches/:matchId/ready — ReactionTap: signal ready
  '''
          route='''  // POST /api/v1/games/matches/:matchId/settle — Coin Flip: acknowledge result reveal and settle funds
  app.post("/matches/:matchId/settle", async (req, reply) => {
    const { matchId } = req.params as { matchId: string };
    return reply.send({ data: await settleCoinFlip(req.user.sub, matchId) });
  });

'''
          if marker not in s: raise SystemExit('route marker not found')
          s=s.replace(marker,route+marker)
          p.write_text(s)

          p=Path('src/modules/games/provablyFair.routes.ts')
          s=p.read_text()
          s=s.replace('const settled = !!match.serverSeed;', 'const settled = match.status === "settled";')
          s=s.replace('const claimedResult = match.gameType === "dice_clash" ? { p1Roll: r.p1Roll, p2Roll: r.p2Roll } : match.gameType === "pvp_coinflip" ? { coinFlip: r.coinFlip } : null;', 'const claimedResult = match.gameType === "dice_clash" ? { p1Roll: r.p1Roll, p2Roll: r.p2Roll } : match.gameType === "pvp_coinflip" ? { coinFlip: r.coinFlip, p1Side: r.p1Side, p2Side: r.p2Side, homePlayerId: r.homePlayerId, player1Id: match.player1Id, player2Id: match.player2Id } : null;')
          p.write_text(s)

          p=Path('src/modules/games/provablyFair.ts')
          s=p.read_text()
          old='case "pvp_coinflip": { const coinFlip=deriveCoinFlip(input.serverSeed,input.clientSeed,input.nonce); computedResult={coinFlip}; resultValid=input.claimedResult?.coinFlip!=null?coinFlip===input.claimedResult.coinFlip:null; explanation="Coin side is derived from byte 0 of HMAC-SHA256: even = heads, odd = tails."; break; }'
          new='case "pvp_coinflip": { const coinFlip=deriveCoinFlip(input.serverSeed,input.clientSeed,input.nonce); const p1Side=deriveCoinFlip(input.serverSeed,input.clientSeed,input.nonce+2); const p2Side=p1Side==="heads"?"tails":"heads"; const ids=(input.playerIds??[]).map(String); const homePlayerId=ids.length>=2 ? (deriveCoinFlip(input.serverSeed,input.clientSeed,input.nonce+1)==="heads" ? ids[0] : ids[1]) : null; computedResult={coinFlip,p1Side,p2Side,homePlayerId}; resultValid=input.claimedResult?.coinFlip!=null ? coinFlip===input.claimedResult.coinFlip && (input.claimedResult.p1Side==null || input.claimedResult.p1Side===p1Side) && (input.claimedResult.p2Side==null || input.claimedResult.p2Side===p2Side) && (input.claimedResult.homePlayerId==null || input.claimedResult.homePlayerId===homePlayerId) : null; explanation="Coin outcome, participant Heads/Tails assignment, and Home/Away assignment are independently derived from distinct HMAC-SHA256 nonces."; break; }'
          if old not in s: raise SystemExit('provably fair coin case not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          npm ci
          npm run build
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bitzimi-coinflip-backend-fix.yml
          git add src/modules/games/matchmaking/matchmaking.service.ts src/modules/games/matchmaking/matchmaking.routes.ts src/modules/games/provablyFair.routes.ts src/modules/games/provablyFair.ts
          git commit -m 'Fix Coin Flip settlement and authoritative assignments'
          git push
