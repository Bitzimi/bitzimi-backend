name: Hide Spin Winner During Spin
on:
  push:
    paths:
      - .github/workflows/hide-spin-winner-during-spin.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch winner visibility
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/modules/games/spinBattle/spinBattle.service.ts')
          s=p.read_text()
          old='''    winnerId: data.winner ?? null,\n    winnerPayout: data.winnerPayout ?? null,'''
          new='''    winnerId: round.status === "result" ? (data.winner ?? null) : null,\n    winnerPayout: round.status === "result" ? (data.winnerPayout ?? null) : null,'''
          if old not in s: raise SystemExit('winner visibility block not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/games/spinBattle/spinBattle.service.ts
          git commit -m "Hide Spin Battle winner until result phase" || true
          git push
          rm -f .github/workflows/hide-spin-winner-during-spin.yml
          git add -u .github/workflows/hide-spin-winner-during-spin.yml
          git commit -m "Remove temporary winner visibility workflow" || true
          git push