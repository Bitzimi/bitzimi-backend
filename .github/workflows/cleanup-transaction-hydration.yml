name: Cleanup transaction hydration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[transaction-cleanup]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicated hydration fallback blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/modules/transactions/transactions.service.ts')
          s=p.read_text()
          block='''  if (type === "affiliate_commission") metadata = { ...metadata, sourceLabel: metadata.sourceLabel ?? `${walletLabel(metadata.eventType ?? "Activity")} commission`, destinationLabel: metadata.destinationLabel ?? `${walletLabel(raw.toWallet ?? "affiliate")} Wallet` };\n  if (type === "ambassador_commission") metadata = { ...metadata, sourceLabel: metadata.sourceLabel ?? `${walletLabel(metadata.eventType ?? "Activity")} reward`, destinationLabel: metadata.destinationLabel ?? `${walletLabel(raw.toWallet ?? "ambassador")} Wallet` };\n  if (type === "referral_bonus") metadata = { ...metadata, sourceLabel: metadata.sourceLabel ?? "Referral Reward", destinationLabel: metadata.destinationLabel ?? `${walletLabel(raw.toWallet ?? "referral")} Wallet` };\n'''
          while s.count(block)>1:
              first=s.find(block); second=s.find(block, first+len(block)); s=s[:second]+s[second+len(block):]
          # Keep only one game-void fallback check.
          void='''  if ((metadata.gameType || raw.referenceType === "game_round" || raw.referenceType === "pvp_match") && /\\b(void|refund|cancelled)\\b/i.test(description ?? "")) type = "game_void";\n'''
          while s.count(void)>1:
              first=s.find(void); second=s.find(void, first+len(void)); s=s[:second]+s[second+len(void):]
          p.write_text(s)
          PY
          npm install
          npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/transactions/transactions.service.ts
          git diff --cached --quiet || git commit -m "Remove duplicate transaction hydration fallbacks [transaction-cleanup]"
          git push origin HEAD:main
