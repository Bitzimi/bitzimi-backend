name: BitZimi one-time history depth fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase persisted Color history depth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/modules/games/colorGame/colorGame.service.ts')
          s=p.read_text()
          s=s.replace('orderBy: { startedAt: "desc" }, take: 200,\n    select: { id: true, roundNumber: true, dailyRoundNumber: true, resultData: true, settledAt: true, startedAt: true, status: true },', 'orderBy: { startedAt: "desc" }, take: 5000,\n    select: { id: true, roundNumber: true, dailyRoundNumber: true, resultData: true, settledAt: true, startedAt: true, status: true },', 1)
          s=s.replace('orderBy: { startedAt: "desc" }, take: 200, select: { id: true, roundNumber: true, dailyRoundNumber: true }', 'orderBy: { startedAt: "desc" }, take: 5000, select: { id: true, roundNumber: true, dailyRoundNumber: true }', 1)
          s=s.replace('orderBy: { placedAt: "desc" }, take: 50 }) : [];', 'orderBy: { placedAt: "desc" }, take: 1000 }) : [];', 1)
          p.write_text(s)
          PY
      - name: Remove workflow
        run: rm -f .github/workflows/bitzimi-history-depth.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/games/colorGame/colorGame.service.ts .github/workflows/bitzimi-history-depth.yml
          git commit -m 'Extend Color Prediction historical bet retention window' || exit 0
          git push
