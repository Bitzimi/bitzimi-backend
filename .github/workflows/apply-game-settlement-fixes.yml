name: Apply game settlement fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply source fixes
        run: node scripts/apply-game-settlement-fixes.mjs
      - name: Verify build
        run: npm install && npm run build
      - name: Commit generated source changes and remove one-time tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src prisma/schema.prisma
          git rm -f scripts/apply-game-settlement-fixes.mjs .github/workflows/apply-game-settlement-fixes.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: settle game ledger entries only after results"
          git push origin main
