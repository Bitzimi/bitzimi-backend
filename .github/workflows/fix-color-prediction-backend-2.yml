name: Fix Color Prediction Backend 2
on:
  push:
    branches: [fix/color-prediction-global-result-void-transactions]
    paths:
      - '.github/workflows/fix-color-prediction-backend-2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete missing state fields
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/modules/games/colorGame/colorGame.service.ts'); s=p.read_text()
          s=s.replace('      clientSeed: active.clientSeed ?? null,\n    };', '      clientSeed: active.clientSeed ?? null,\n      spinAngle: typeof resultData?.spinAngle === "number" ? resultData.spinAngle : null,\n    };')
          s=s.replace('      clientSeed: null,\n    };', '      clientSeed: null,\n      spinAngle: null,\n    };')
          s=s.replace('      clientSeed,\n    };', '      clientSeed,\n      spinAngle: typeof resultData?.spinAngle === "number" ? resultData.spinAngle : null,\n    };')
          s=s.replace('      clientSeed: state.clientSeed,\n    };', '      clientSeed: state.clientSeed,\n      spinAngle: state.spinAngle,\n    };')
          p.write_text(s)
      - name: Build
        run: npm install && npm run build
      - name: Commit and remove workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-color-prediction-backend.yml .github/workflows/fix-color-prediction-backend-2.yml || true
          git add src/modules/games/colorGame/colorGame.service.ts src/modules/wallets/wallets.service.ts
          git commit -m 'Fix global Color Prediction result and transaction records'
          git push
