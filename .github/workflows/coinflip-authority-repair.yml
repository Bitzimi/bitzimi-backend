name: Coin Flip authority repair
on:
  push:
    branches: [main]
    paths:
      - 'src/modules/games/matchmaking/matchmaking.service.ts'
      - '.github/workflows/coinflip-authority-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[coinflip-authority-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair Coin Flip authority and debit timing
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('src/modules/games/matchmaking/matchmaking.service.ts')
          s=p.read_text()

          # Coin Flip is special: a reserved search is only a queue reservation.
          # No wallet debit occurs until a real opponent is atomically matched.
          start=s.index('export async function joinQueue')
          end=s.index('export async function getQueueStatus', start)
          new_join='''export async function joinQueue(userId: string, gameType: MatchGameType, stake: number) {\n  if (gameType === "pvp_coinflip") return joinCoinFlipQueue(userId, stake);\n  const activeMatch = await db.pvpMatch.findFirst({ where: { gameType, status: "active", OR: [{ player1Id: userId }, { player2Id: userId }] } });\n  if (activeMatch) { const entry = await db.matchmakingQueue.findFirst({ where: { userId, gameType, matchId: activeMatch.id } }); return { status: "matched" as const, queueId: entry?.id ?? "", matchId: activeMatch.id }; }\n  const now = new Date();\n  const [enabled, maintenance, configuredStakes] = await Promise.all([getConfigValue<boolean>("game." + gameType + ".enabled", true), getConfigValue<boolean>("game." + gameType + ".maintenance", false), getConfigValue<number[]>("game." + gameType + ".stakes", [])]);\n  if (!enabled) throw Object.assign(new Error(gameType + " is currently unavailable"), { statusCode: 503, code: "GAME_DISABLED" });\n  if (maintenance) throw Object.assign(new Error(gameType + " is under maintenance"), { statusCode: 503, code: "GAME_MAINTENANCE" });\n  if (configuredStakes.length && !configuredStakes.includes(stake)) throw Object.assign(new Error("Stake $" + stake + " is not available for this game"), { statusCode: 400, code: "INVALID_STAKE" });\n  const existing = await db.matchmakingQueue.findFirst({ where: { userId, gameType, stake, status: { in: ["reserved", "waiting"] }, expiresAt: { gt: now } } });\n  if (existing) {\n    if (existing.status === "reserved") return { status: "waiting" as const, queueId: existing.id };\n    await db.$transaction(async tx => { await debitWallet(tx, userId, "game", stake); const claimed = await tx.matchmakingQueue.updateMany({ where: { id: existing.id, status: "waiting" }, data: { status: "reserved", expiresAt: new Date(Date.now() + QUEUE_TTL_MS) } }); if (!claimed.count) throw Object.assign(new Error("Queue state changed; please search again"), { statusCode: 409, code: "QUEUE_STATE_CHANGED" }); });\n    return { status: "waiting" as const, queueId: existing.id };\n  }\n  const opponent = await db.matchmakingQueue.findFirst({ where: { gameType, stake, status: "reserved", userId: { not: userId }, expiresAt: { gt: now } }, orderBy: { createdAt: "asc" } });\n  if (!opponent) { const entry = await db.$transaction(async tx => { return tx.matchmakingQueue.create({ data: { userId, gameType, stake, status: "reserved", expiresAt: new Date(Date.now() + QUEUE_TTL_MS) } }); }); return { status: "waiting" as const, queueId: entry.id }; }\n  try {\n    await db.$transaction(async tx => { await debitWallet(tx, userId, "game", stake); const claimed = await tx.matchmakingQueue.updateMany({ where: { id: opponent.id, status: "reserved", expiresAt: { gt: now } }, data: { status: "matched" } }); if (!claimed.count) throw Object.assign(new Error("Opponent is no longer available"), { statusCode: 409, code: "OPPONENT_UNAVAILABLE" }); });\n    const match = await createReservedMatchForPlayers(userId, opponent.userId, gameType, stake);\n    await db.matchmakingQueue.update({ where: { id: opponent.id }, data: { matchId: match.id } });\n    const mine = await db.matchmakingQueue.create({ data: { userId, gameType, stake, status: "matched", matchId: match.id, expiresAt: new Date(Date.now() + QUEUE_TTL_MS) } });\n    setImmediate(() => { activateReferral(userId).catch(() => {}); activateReferral(opponent.userId).catch(() => {}); });\n    return { status: "matched" as const, queueId: mine.id, matchId: match.id };\n  } catch (err) { throw err; }\n}\n\nasync function joinCoinFlipQueue(userId: string, stake: number) {\n  const gameType: MatchGameType = "pvp_coinflip";\n  const now = new Date();\n  const [enabled, maintenance, configuredStakes] = await Promise.all([getConfigValue<boolean>("game." + gameType + ".enabled", true), getConfigValue<boolean>("game." + gameType + ".maintenance", false), getConfigValue<number[]>("game." + gameType + ".stakes", [])]);\n  if (!enabled) throw Object.assign(new Error("pvp_coinflip is currently unavailable"), { statusCode: 503, code: "GAME_DISABLED" });\n  if (maintenance) throw Object.assign(new Error("pvp_coinflip is under maintenance"), { statusCode: 503, code: "GAME_MAINTENANCE" });\n  if (configuredStakes.length && !configuredStakes.includes(stake)) throw Object.assign(new Error("Stake $" + stake + " is not available for this game"), { statusCode: 400, code: "INVALID_STAKE" });\n  const activeMatch = await db.pvpMatch.findFirst({ where: { gameType, status: "active", OR: [{ player1Id: userId }, { player2Id: userId }] } });\n  if (activeMatch) { const entry = await db.matchmakingQueue.findFirst({ where: { userId, gameType, matchId: activeMatch.id } }); return { status: "matched" as const, queueId: entry?.id ?? "", matchId: activeMatch.id }; }\n  const existing = await db.matchmakingQueue.findFirst({ where: { userId, gameType, stake, status: "reserved", expiresAt: { gt: now } } });\n  if (existing) return { status: "waiting" as const, queueId: existing.id };\n\n  const outcome = await db.$transaction(async tx => {\n    const opponent = await tx.matchmakingQueue.findFirst({ where: { gameType, stake, status: "reserved", userId: { not: userId }, expiresAt: { gt: now } }, orderBy: { createdAt: "asc" } });\n    if (!opponent) {\n      const entry = await tx.matchmakingQueue.create({ data: { userId, gameType, stake, status: "reserved", expiresAt: new Date(Date.now() + QUEUE_TTL_MS) } });\n      return { status: "waiting" as const, queueId: entry.id };\n    }\n    await tx.$queryRaw`SELECT id FROM matchmaking_queue WHERE id = ${opponent.id} FOR UPDATE`;\n    const claimed = await tx.matchmakingQueue.updateMany({ where: { id: opponent.id, status: "reserved", expiresAt: { gt: now } }, data: { status: "matched" } });\n    if (!claimed.count) throw Object.assign(new Error("Opponent is no longer available"), { statusCode: 409, code: "OPPONENT_UNAVAILABLE" });\n    await debitWallet(tx, userId, "game", stake);\n    await debitWallet(tx, opponent.userId, "game", stake);\n    const serverSeed = generateServerSeed();\n    const serverSeedHash = hashServerSeed(serverSeed);\n    const verificationId = generateVerificationId(gameType);\n    const match = await tx.pvpMatch.create({ data: { gameType, stake, player1Id: userId, player2Id: opponent.userId, serverSeedHash, verificationId, serverSeed } });\n    await tx.matchmakingQueue.update({ where: { id: opponent.id }, data: { matchId: match.id } });\n    const mine = await tx.matchmakingQueue.create({ data: { userId, gameType, stake, status: "matched", matchId: match.id, expiresAt: new Date(Date.now() + QUEUE_TTL_MS) } });\n    return { status: "matched" as const, queueId: mine.id, matchId: match.id, player1Id: userId, player2Id: opponent.userId, serverSeed };\n  });\n  if (outcome.status === "matched") {\n    try { await prepareCoinFlipMatch(outcome.matchId, outcome.player1Id, outcome.player2Id, stake, outcome.serverSeed); } catch (err) { console.error(`[Matchmaking] Coin Flip preparation deferred for ${outcome.matchId}:`, err); }\n    setImmediate(() => { activateReferral(userId).catch(() => {}); activateReferral(outcome.player2Id).catch(() => {}); });\n  }\n  return outcome;\n}\n\n'''
  s=s[:start]+new_join+s[end:]

          # Reserved Coin Flip entries have no debit, so expiry/cancellation must not refund money that was never taken.
          s=s.replace('if (claimed.count) await creditWallet(tx, entry.userId, "game", entry.stake);','if (claimed.count && entry.gameType !== "pvp_coinflip") await creditWallet(tx, entry.userId, "game", entry.stake);')
          s=s.replace('if (claimed.count) await creditWallet(tx, userId, "game", entry.stake);','if (claimed.count && entry.gameType !== "pvp_coinflip") await creditWallet(tx, userId, "game", entry.stake);')

          p.write_text(s)
      - name: Verify Coin Flip debit timing and authority
        shell: python
        run: |
          from pathlib import Path
          s=Path('src/modules/games/matchmaking/matchmaking.service.ts').read_text()
          required=['async function joinCoinFlipQueue','await debitWallet(tx, userId, "game", stake);','await debitWallet(tx, opponent.userId, "game", stake);','const p1Side=randomInt(2)===0?"heads":"tails"','homePlayerId=randomInt(2)===0?p1Id:p2Id','const totalPool=stake*2','pool:totalPool','payout:match.gameType==="pvp_coinflip"']
          for x in required:
              if x not in s: raise SystemExit(f'Missing invariant: {x}')
          # The Coin Flip waiting path must never contain a debit before opponent discovery.
          block=s[s.index('async function joinCoinFlipQueue'):s.index('export async function getQueueStatus')]
          before_match=block[:block.index('const outcome = await db.$transaction')]
          if 'debitWallet' in before_match: raise SystemExit('Coin Flip waiting path debits before matchmaking')
          if 'p1Side:"heads",p2Side:"tails"' in s: raise SystemExit('Hard-coded Coin Flip side mapping remains')
      - name: Build backend
        run: |
          npm install
          npm run build
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/games/matchmaking/matchmaking.service.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: debit Coin Flip only after backend match [coinflip-authority-repair]'
          git push
